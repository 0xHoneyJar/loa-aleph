name: Slice 3 late-correction boundary repair

on:
  push:
    branches:
      - agent/slice-03-unified-lineage
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/slice-03-unified-lineage
          fetch-depth: 0
          persist-credentials: true

      - name: Use build Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.18.0

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Apply bounded late-correction repair
        run: node .github/slice3-late-boundary/apply.mjs

      - name: Remove temporary repair machinery
        run: rm -rf .github/slice3-late-boundary .github/workflows/slice3-late-boundary.yml

      - name: Regenerate shipped JavaScript runtime
        run: npm run runtime:build

      - name: Commit candidate before clean-source tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Slice 3: enforce late-correction BLOCK boundary [slice3-late-boundary]"

      - name: Run complete repository test suite
        run: npm test

      - name: Require drift-clean candidate
        run: test -z "$(git status --porcelain)"

      - name: Push verified repaired candidate
        run: git push origin HEAD:agent/slice-03-unified-lineage
